name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' #UTC

jobs:
  composer:
    uses: kawax/composer-workflow/.github/workflows/update.yml@57b73efb159a6efbabf16d2ef16feb218b1769d7 # v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      php: latest
  npm:
    uses: kawax/npm-workflow/.github/workflows/update.yml@0340b8e7582f60e440c100abca8c306ddf221fda # v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
