name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 6' #UTC

jobs:
  composer:
    uses: kawax/composer-workflow/.github/workflows/update.yml@c09dcdebb0bb078d7f4493c3854fa997c51b74c4 # v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      php: latest
  npm:
    uses: kawax/npm-workflow/.github/workflows/update.yml@0340b8e7582f60e440c100abca8c306ddf221fda # v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
