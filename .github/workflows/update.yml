name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 6' #UTC

jobs:
  composer:
    uses: kawax/composer-workflow/.github/workflows/update.yml@6ff5e07c74260b6574f565da4fbd8381aab9ed25 # v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      php: latest
  npm:
    uses: kawax/npm-workflow/.github/workflows/update.yml@0340b8e7582f60e440c100abca8c306ddf221fda # v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
