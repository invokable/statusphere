name: update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' #UTC

jobs:
  composer:
    uses: kawax/composer-workflow/.github/workflows/update.yml@888e53044760bcd5a8dfcb8501ae7d48f58ab10c # v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    with:
      php: latest
  npm:
    uses: kawax/npm-workflow/.github/workflows/update.yml@0340b8e7582f60e440c100abca8c306ddf221fda # v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
